# Køres én gang, mens den gamle WordPress-side stadig er live.
# Henter de fire billeder fra det gamle tema og lægger dem i assets/images.
name: Hent billeder fra den gamle side
on: workflow_dispatch
permissions:
  contents: write
jobs:
  hent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hent billeder
        run: |
          mkdir -p assets/images
          for f in maerke-guld.png mockup-skilt.png kasper.jpg logo.png; do
            curl -fsSL -o "assets/images/$f" "https://forlagetuldahl.dk/wp-content/themes/uldahl/assets/images/$f"
          done
          ls -l assets/images
      - name: Gem i repoet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images
          git diff --cached --quiet || git commit -m "Hent billeder fra det gamle WordPress-tema"
          git push
